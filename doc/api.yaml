openapi: 3.0.0
servers:
  - url: http://localhost:3000/api/v3
info:
  title: WASAText
  description: Web And Software Architecture Exam Project
  version: 1.0.0
security:
  - bearerAuth: []
tags:
  - name: users
    description: Users
  - name: messages
    description: Messages
  - name: conversations
    description: Conversations
  - name: groups
    description: Groups
  - name: reactions
    description: Reactions
  - name: comments
    description: Comments
paths:
  /groups:
    post:
      tags: ["groups"]
      summary: Create a group
      description: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            example:
              type: object
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
                photo:
                  $ref: "#/components/schemas/Photo"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /forward/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["groups"]
      summary: Forward a message to a group
      description: Forward a message to a group
      operationId: forwardMessageToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                messageId:
                  description: The message to forward
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /send/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["groups"]
      summary: Send a message to a group
      description: Send a message to a group
      operationId: sendMessageToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                messageContent:
                  $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["groups"]
      summary: Get group data
      description: Get group data
      operationId: getGroup
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: ["groups"]
      summary: Delete group
      description: Delete group
      operationId: deleteGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /name/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["groups"]
      operationId: setGroupName
      summary: Change group name
      description: Change group name
      requestBody:
        required: true
        content:
          application/json:
            example:
              type: object
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /photo/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["groups"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: Update group photo
      requestBody:
        required: true
        content:
          application/json:
            example:
              type: object
            schema:
              description: Request body
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/Photo"
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /leave/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["groups"]
      summary: Leave the group
      description: Leave the group
      operationId: leaveGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /remove/{groupId}/user/{userId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["groups"]
      summary: Remove user from group
      description: Remove user from group
      operationId: removeUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /reactions/{messageId}:
    parameters:
      - name: messageId
        in: path
        description: Message id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["reactions"]
      summary: Add reaction to a message
      description: Add reaction to a message
      operationId: addReaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                emoji:
                  $ref: "#/components/schemas/Emoji"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: ["reactions"]
      summary: Remove a reaction from a message
      description: Remove a reaction from a message
      operationId: deleteReaction
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: ["reactions"]
      summary: Get message reactions
      description: Get message reactions
      operationId: getReactions
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: Request body
                type: object
                properties:
                  reactions:
                    description: Reactions
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /comments/{messageId}:
    parameters:
      - name: messageId
        in: path
        description: Message id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["comments"]
      summary: Remove a comment
      description: Remove a comment
      operationId: uncommentMessage
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: ["comments"]
      summary: Create a comment
      description: Create a comment
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                messageContent:
                  $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /conversations:
    get:
      tags: ["conversations"]
      summary: Get user conversations
      description: Get user conversations
      operationId: getMyConversations
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: Successful
                type: object
                properties:
                  conversations:
                    description: Conversations
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: object
                      properties:
                        conversationId:
                          description: Conversation id
                          type: integer
                          format: int64
                        isGroup:
                          description: Is it a group?
                          type: boolean
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        description: Conversation id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversations"]
      summary: Get conversation by id
      description: Get conversation by id
      operationId: getConversation
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: Successful
                type: object
                properties:
                  messages:
                    description: Messages
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: integer
                      format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /members/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        description: Conversation id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversations"]
      summary: Get members of a conversation
      description: Get members of a conversation
      operationId: getMembers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: Successful
                type: object
                properties:
                  members:
                    description: Members
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: integer
                      format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /forward/user/{userId}:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["messages"]
      summary: Forward a message to a user
      description: Forward a message to a group
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                messageId:
                  description: The message to forward
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /send/user/{userId}:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["messages"]
      summary: Send a message to a user
      description: Send a message to a user
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                messageContent:
                  $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /name/user:
    put:
      tags: ["users"]
      operationId: setMyUserName
      summary: Update user name
      description: Update user name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /photo/user:
    put:
      tags: ["users"]
      operationId: setMyPhoto
      summary: Update user photo
      description: Update user photo
      requestBody:
        required: true
        content:
          application/json:
            example:
              type: object
            schema:
              description: Request body
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/Photo"
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /user:
    get:
      tags: ["users"]
      summary: Get WASAText users
      description: Get WASAText users
      operationId: getUsers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: Successful
                type: object
                properties:
                  user:
                    description: Users
                    type: array
                    minItems: 0
                    maxItems: 1024
                    items:
                      type: integer
                      format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: ["users"]
      summary: Delete user
      description: Delete authenticated user
      operationId: deleteUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /user/{userId}:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["users"]
      summary: Get user data
      description: Get user data
      operationId: getUserById
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /session:
    post:
      tags: ["users"]
      summary: Logs in the user
      description: Logs in the user
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                description: Created
                type: object
                properties:
                  userId:
                    description: User id
                    type: integer
                    format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
  schemas:
    Group:
      description: Group
      type: object
      properties:
        conversationId:
          description: Group conversation
          type: integer
          format: int64
        founderId:
          description: Group founder
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/Name"
        photo:
          $ref: "#/components/schemas/Photo"
        timestamp:
          description: Group timestamp
          type: string
          format: date-time
    Emoji:
      description: Emoji
      type: string
      pattern: '^.*$'
      minLength: 1
      maxLength: 1024
    Reaction:
      description: Reaction
      type: object
      properties:
        emoji:
          $ref: "#/components/schemas/Emoji"
        reactedMessageId:
          description: Reacted message
          type: integer
          format: int64
        authorId:
          description: Reaction author
          type: integer
          format: int64
    Message:
      description: Message
      type: object
      properties:
        messageId:
          description: Message id
          type: integer
          format: int64
        messageContent:
          $ref: "#/components/schemas/MessageContent"
        authorId:
          description: User id
          type: integer
          format: int64
        conversationId:
          description: Conversation id
          type: integer
          format: int64
        sendAt:
          description: Message timestamp
          type: string
          format: date-time
        isForwarded:
          description: Message forwarded
          type: boolean
        commentedMessageId:
          description: Commented message id
          type: integer
          format: int64
    User:
      description: User
      type: object
      properties:
        userId:
          description: User id
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/Name"
        photo:
          $ref: "#/components/schemas/Photo"
    MessageContent:
      description: Message content
      type: object
      properties:
        text:
          description: Message text
          type: string
          pattern: '[\d\D]+'
          minLength: 1
          maxLength: 1024
        photo:
          $ref: "#/components/schemas/Photo"
    Photo:
      description: Photo
      type: string
      format: binary
      minLength: 1
      maxLength: 1024
    Name:
      description: Generic name
      type: string
      pattern: '^[a-zA-Z0-9_]+$'
      minLength: 1
      maxLength: 1024
