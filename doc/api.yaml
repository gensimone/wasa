      tags: ["groups"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: Update group photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: The group photo
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/Photo"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: The photo url
                type: object
                properties:
                  photoUrl:
                    $ref: "#/components/schemas/PhotoUrl"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/user:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["groups"]
      summary: Leave the group
      description: Leave the group
      operationId: leaveGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/user/{userId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["groups"]
      summary: Remove user from group
      description: Remove user from group
      operationId: removeUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /conversations:
    get:
      tags: ["conversations"]
      summary: Get user conversations
      description: Get user conversations
      operationId: getMyConversations
      responses:
        '200':
          description: Successful
