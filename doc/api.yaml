openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: Web and Software Architecture exam project.
  version: 1.0.0
tags:
  - name: login
    description: Login releated actions.
  - name: user
    description: Everything about users.
  - name: message
    description: Everything about messages.
  - name: conversation
    description: Everything about conversations.
  - name: group
    description: Everything about groups.
paths:
  /groups:
    post:
      tags: ["group"]
      summary: Create a group
      operationId: createGroup
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{groupId}/name:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["group"]
      operationId: setGroupName
      summary: Change group name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: '^\w+$'
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/photo:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["group"]
      operationId: setGroupPhoto
      summary: Update group photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["group"]
      summary: Get group data
      operationId: getGroup
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    put:
      tags: ["group"]
      summary: Leave the group
      operationId: leaveGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["group"]
      summary: Delete group
      operationId: deleteGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/users:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["group"]
      summary: Add user to group
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/users/{userId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["group"]
      summary: Remove user from group
      operationId: removeUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /messages/{messageId}/reactions:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["message"]
      summary: Add reaction to a message
      operationId: addReaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["message"]
      summary: Remove a reaction from a message
      operationId: deleteReaction
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      tags: ["message"]
      summary: Get message reactions
      operationId: getReactions
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["message"]
      summary: Forward a message
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      tags: ["message"]
      summary: Get message data
      operationId: getMessage
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["message"]
      summary: Remove a message
      operationId: deleteMessage
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /messages/{messageId}/comments:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["message"]
      summary: Remove a comment
      operationId: uncommentMessage
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["message"]
      summary: Create a comment
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  anyOf:
                    - type: string
                    - type: string
                      format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
  /conversations:
    get:
      tags: ["conversation"]
      summary: Get user conversations
      operationId: getMyConversations
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        isGroup:
                          type: boolean
  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversation"]
      summary: Get conversation by id
      operationId: getConversation
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["conversation"]
      summary: Send a message to an existing conversation
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  anyOf:
                    - type: string
                    - type: string
                      format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /conversation/{conversationId}/members:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversation"]
      summary: Get members of a conversation
      operationId: getMembers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: integer
                      format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /conversation/new/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["conversation"]
      summary: Create a new conversation and send a message to it
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  anyOf:
                    - type: string
                    - type: string
                      format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
  /user/{userId}/name:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["user"]
      operationId: setMyUserName
      summary: Update user name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: '^\w+$'
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /user/{userId}/photo:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["user"]
      operationId: setMyPhoto
      summary: Update user photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /user:
    get:
      tags: ["user"]
      summary: Get WASAText users
      operationId: getUsers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: integer
                      format: int64
  /user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["user"]
      summary: Delete user
      operationId: deleteUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      tags: ["user"]
      summary: Get user data
      operationId: getUserById
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: '^\w+$'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
  schemas:
    Group:
      description: Group
      type: object
      properties:
        conversationId:
          description: Group conversation
          type: integer
          format: int64
        userId:
          description: Group founder
          type: integer
          format: int64
        name:
          description: Group name
          type: string
          pattern: '^\w+$'
        photo:
          description: Group photo
          type: string
          format: binary
        timestamp:
          description: Group timestamp
          type: string
          format: date-time
    Reaction:
      description: Reaction
      type: object
      properties:
        emoji:
          description: Emoji index
          type: integer
          format: int64
        messageId:
          description: Reacted message
          type: integer
          format: int64
        userId:
          description: Reaction author
          type: integer
          format: int64
    Message:
      description: Message
      type: object
      properties:
        id:
          description: Message id
          type: integer
          format: int64
        content:
          description: Message content
          anyOf:
            - type: string
            - type: string
              format: binary
        userId:
          description: User id
          type: integer
          format: int64
        conversationId:
          description: Conversation id
          type: integer
          format: int64
        timestamp:
          description: Message timestamp
          type: string
          format: date-time
        isForwarded:
          description: Message forwarded
          type: boolean
        messageId:
          description: Commented message id
          type: integer
          format: int64
    User:
      description: User
      type: object
      properties:
        id:
          description: User id
          type: integer
          format: int64
        name:
          description: User name
          type: string
          pattern: '^\w+$'
        photo:
          description: User photo
          type: string
          format: binary
