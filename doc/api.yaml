components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string

  schemas:
    User:
      description: User
      type: object
      properties:
        userId:
          description: User id
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/Name"
        photoUrl:
          $ref: "#/components/schemas/PhotoUrl"

    Group:
      description: Group
      type: object
      properties:
        conversationId:
          description: Group conversation id
          type: integer
          format: int64
        founderId:
          description: Group founder id
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/Name"
        photoUrl:
          $ref: "#/components/schemas/PhotoUrl"
        createdAt:
          description: Group timestamp
          type: string
          format: date-time

    Name:
      description: Generic name
      type: string
      pattern: '^.*$'
      minLength: 1
      maxLength: 1024

    PhotoUrl:
      description: Photo URL
      type: string
      format: url
      minLength: 1
      maxLength: 1024


    Message:
      description: Message
      type: object
      properties:
        messageId:
          description: Message id
          type: integer
          format: int64
        text:
          description: Message text
          type: string
          pattern: '^.*$'
          minLength: 1
          maxLength: 1024
        attachmentId:
          description: Attachment id
          type: integer
          format: int64
        senderId:
          description: Sender id
          type: integer
          format: int64
        conversationId:
          description: Conversation id
          type: integer
          format: int64
        createdAt:
          description: Message timestamp
          type: string
          format: date-time
        isForwarded:
          description: Message is forwarded
          type: boolean
        commentTo:
          description: Commented message id
          type: integer
          format: int64

    MessageContent:
      description: Message content
      type: object
      properties:
        text:
          description: Message text
          type: string
          minLength: 0
          maxLength: 1024
          pattern: "^.*$"
        file:
          description: Binary file
          type: string
          format: binary
          minLength: 1
          maxLength: 1024
        mediaType:
          $ref: "#/components/schemas/MediaType"

    Attachment:
      description: Attachment
      type: object
      properties:
        attachmentId:
          description: Attachment id
          type: integer
          format: int64
        url:
          description: Attachment URL
          type: string
          format: url
        mediaType:
          $ref: "#/components/schemas/MediaType"

    MediaType:
      description: Media type
      type: string
      enum: [image, video, audio, file]

    Status:
      description: Status
      type: object
      properties:
        messageId:
          description: Message id
          type: integer
          format: int64
        userId:
          description: User id
          type: integer
          format: int64
        info:
          description: Info
          type: string
          enum: [read, not_received, received]

    Reaction:
      description: Reaction
      type: object
      properties:
        emojiCode:
          $ref: "#/components/schemas/EmojiCode"
        messageId:
          description: Message id
          type: integer
          format: int64
        senderId:
          description: Sender id
          type: integer
          format: int64

    EmojiCode:
      description: Emoji code
      type: string
      enum: [like, love, laugh, sad, angry, thumb]
