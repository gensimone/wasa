openapi: 3.0.0

servers:
  - url: "http://localhost:3000"

info:
  title: WASAText
  description: Web and Software Architecture exam project.
  version: 1.0.0

tags:
  - name: login
    description: Login releated actions.
  - name: user
    description: Everything about users.
  - name: messages
    description: Everything about messages.
  - name: conversations
    description: Everything about conversations.
  - name: groups
    description: Everything about groups.
  - name: comments
    description: Everything about comments.
  - name: reactions
    description: Everything about reactions.

paths:
  /comments/{conversationId}/{messageId}/{commentId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["comments"]
      operationId: getComment
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '401':
          description: The user is not authorized to delete the comment.
        '404':
          description: Conversation, message or comment not found.
    delete:
      tags: ["comments"]
      operationId: deleteComment
      responses:
        '200':
          description: Successful operation.
        '401':
          description: The user is not authorized to delete the comment.
        '404':
          description: Conversation, message or comment not found.

  /comments/{conversationId}/{messageId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["comments"]
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Successful operation.
        '404':
          description: Conversation, message or comment not found.

  /conversations/{conversationId}/{messageId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["messages"]
      operationId: forwardMessage
      responses:
        '200':
          description: Successful operation.
        '404':
          description: Conversation or message not found.
    get:
      tags: ["messages"]
      operationId: getMessage
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '404':
          description: Conversation or message not found.
    delete:
      tags: ["messages"]
      operationId: deleteMessage
      responses:
        '200':
          description: Successful operation.
        '404':
          description: Conversation or message not found.

  /reactions/{reactionId}:
    parameters:
      - name: reactionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["reactions"]
      operationId: deleteReaction
      responses:
        '200':
          description: Reaction deleted.
        '404':
          description: Reaction not found.
    get:
      tags: ["reactions"]
      operationId: getReaction
      responses:
        '200':
          description: The reaction object was found and returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        '404':
          description: Reaction not found.

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversations"]
      operationId: getConversation
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '404':
          description: Conversation not found.
    post:
      tags: ["messages"]
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Successful operation.
        '404':
          description: Conversation not found.

  /user/{userId}/conversations:
    get:
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      tags: ["conversations"]
      operationId: getMyConversations
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '404':
          description: User not found.

  /user/{userId}/username:
    put:
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      tags: ["user"]
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '200':
          description: Successful operation.
        '404':
          description: User not found.

  /user/{userId}/photo:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["user"]
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful operation.
        '404':
          description: User not found.

  /user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["user"]
      operationId: getUserById
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '404':
          description: User not found.

  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        '201':
          description: |
            User log-in action successful.
            The newly crated user id is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: integer
                    format: int64

components:
  schemas:

    GroupName:
      type: string
      pattern: '^\w+$'

    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        conversation:
          type: integer
          format: int64
        members:
          type: array
          items:
            type: integer
            format: int64
        name:
          $ref: "#/components/schemas/GroupName"
        photo:
          type: string

    Conversation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        messages:
          type: array
          items:
            type: integer
            format: int64

    Reaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          type: integer
          format: int64
        emoji:
          type: integer
          format: int64

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        commentedMessage:
          type: integer
          format: int64
        content:
          type: string

    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reply:
          type: integer
          format: int64
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        author:
          type: integer
          format: int64
        views:
          type: array
          items:
            type: integer
            format: int64
        forwarded:
          type: boolean
        reactions:
          type: array
          items:
            type: integer
            format: int64
        comments:
          type: array
          items:
            type: integer
            format: int64

    UserName:
      type: string
      pattern: '^\w+$'

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          $ref: "#/components/schemas/UserName"
        photo:
          type: string
        conversations:
          type: array
          items:
            type: integer
            format: int64
        groups:
          type: array
          items:
            type: integer
            format: int64
