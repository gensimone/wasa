openapi: 3.0.4
servers:
  - url: http://localhost:3000
info:
  title: WASAText
  description: Web and Software Architecture exam project.
  version: 1.0.0
tags:
  - name: login
    description: Login releated actions.
  - name: user
    description: Everything about users.
  - name: message
    description: Everything about messages.
  - name: conversation
    description: Everything about conversations.
  - name: group
    description: Everything about groups.
paths:
  /groups:
    post:
      tags: ["group"]
      summary: Create a group
      description: Create a group
      operationId: createGroup
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /groups/{groupId}/name:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["group"]
      operationId: setGroupName
      summary: Change group name
      description: Change group name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/photo:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["group"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: Update group photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/Image"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/leave:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["group"]
      summary: Leave the group
      description: Leave the group
      operationId: leaveGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["group"]
      summary: Get group data
      description: Get group data
      operationId: getGroup
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["group"]
      summary: Delete group
      description: Delete group
      operationId: deleteGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/users:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["group"]
      summary: Add user to group
      description: Add user to group
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                id:
                  description: User id
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /groups/{groupId}/users/{userId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["group"]
      summary: Remove user from group
      description: Remove user from group
      operationId: removeUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /messages/{messageId}/reactions:
    parameters:
      - name: messageId
        in: path
        description: Message id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["message"]
      summary: Add reaction to a message
      description: Add reaction to a message
      operationId: addReaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                id:
                  description: Emoji id
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["message"]
      summary: Remove a reaction from a message
      description: Remove a reaction from a message
      operationId: deleteReaction
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      tags: ["message"]
      summary: Get message reactions
      description: Get message reactions
      operationId: getReactions
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                description: Request body
                type: object
                properties:
                  reactions:
                    description: Reactions id
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      $ref: "#/components/schemas/Reaction"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        description: Message id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["message"]
      summary: Forward a message
      description: Forward a message
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                id:
                  description: Message id
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      tags: ["message"]
      summary: Get message data
      description: Get message data
      operationId: getMessage
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["message"]
      summary: Remove a message
      description: Remove a message
      operationId: deleteMessage
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /messages/{messageId}/comments:
    parameters:
      - name: messageId
        in: path
        description: Message id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["message"]
      summary: Remove a comment
      description: Remove a comment
      operationId: uncommentMessage
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["message"]
      summary: Create a comment
      description: Create a comment
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                content:
                  $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
  /conversations:
    get:
      tags: ["conversation"]
      summary: Get user conversations
      description: Get user conversations
      operationId: getMyConversations
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                description: Successful
                type: object
                properties:
                  conversations:
                    description: Conversations
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: object
                      properties:
                        id:
                          description: Conversation id
                          type: integer
                          format: int64
                        isGroup:
                          description: Is it a group?
                          type: boolean
  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        description: Conversation id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversation"]
      summary: Get conversation by id
      description: Get conversation by id
      operationId: getConversation
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                description: Successful
                type: object
                properties:
                  messages:
                    description: Messages
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: integer
                      format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["conversation"]
      summary: Send a message to an existing conversation
      description: Send a message to an existing conversation
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                content:
                  $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /conversation/new/{userId}:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["conversation"]
      summary: Create a new conversation and send a message to it
      description: Create a new conversation and send a message to it
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                content:
                  $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                description: Created
                type: object
                properties:
                  id:
                    description: Conversation id
                    type: integer
                    format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
  /members/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        description: Conversation id
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: ["conversation"]
      summary: Get members of a conversation
      description: Get members of a conversation
      operationId: getMembers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                description: Successful
                type: object
                properties:
                  members:
                    description: Members
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: integer
                      format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /user/{userId}/name:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["user"]
      operationId: setMyUserName
      summary: Update user name
      description: Update user name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                description: Successful
                type: object
                properties:
                  name:
                    $ref: "#/components/schemas/Name"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /user/{userId}/photo:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["user"]
      operationId: setMyPhoto
      summary: Update user photo
      description: Update user photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                photo:
                  $ref: "#/components/schemas/Image"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /user:
    get:
      tags: ["user"]
      summary: Get WASAText users
      description: Get WASAText users
      operationId: getUsers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                description: Successful
                type: object
                properties:
                  users:
                    description: Users
                    type: array
                    minItems: 0
                    maxItems: 1024
                    items:
                      type: integer
                      format: int64
  /user/{userId}:
    parameters:
      - name: userId
        in: path
        description: User id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["user"]
      summary: Delete user
      description: Delete user
      operationId: deleteUser
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      tags: ["user"]
      summary: Get user data
      description: Get user data
      operationId: getUserById
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: Logs in the user
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request body
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            description: Error
            type: object
            properties:
              error:
                description: Message
                type: string
  schemas:
    Group:
      description: Group
      type: object
      properties:
        conversationId:
          description: Group conversation
          type: integer
          format: int64
        userId:
          description: Group founder
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/Name"
        photo:
          $ref: "#/components/schemas/Image"
        timestamp:
          description: Group timestamp
          type: string
          format: date-time
    Reaction:
      description: Reaction
      type: object
      properties:
        emoji:
          description: Emoji index
          type: integer
          format: int64
        messageId:
          description: Reacted message
          type: integer
          format: int64
        userId:
          description: Reaction author
          type: integer
          format: int64
    Message:
      description: Message
      type: object
      properties:
        id:
          description: Message id
          type: integer
          format: int64
        content:
          $ref: "#/components/schemas/MessageContent"
        userId:
          description: User id
          type: integer
          format: int64
        conversationId:
          description: Conversation id
          type: integer
          format: int64
        timestamp:
          description: Message timestamp
          type: string
          format: date-time
        isForwarded:
          description: Message forwarded
          type: boolean
        messageId:
          description: Commented message id
          type: integer
          format: int64
    User:
      description: User
      type: object
      properties:
        id:
          description: User id
          type: integer
          format: int64
        name:
          $ref: "#/components/schemas/Name"
        photo:
          $ref: "#/components/schemas/Image"
    MessageContent:
      description: Message content
      pattern: '[\d\D]+'
      anyOf:
        - type: string
          minLength: 1
          maxLength: 1024
        - $ref: "#/components/schemas/Image"
    Image:
      description: Image
      type: string
      format: binary
      minLength: 1
      maxLength: 1024
    Name:
      description: Generic name
      type: string
      pattern: '^[a-zA-Z0-9_]+$'
      minLength: 1
      maxLength: 1024
