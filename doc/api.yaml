      tags: ["conversations"]
      summary: Send a message to a conversation
      description: Send a message to a conversation
      operationId: sendMessageToConversation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
