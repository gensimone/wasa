openapi: 3.0.0

servers:
  - url: http://localhost:3000/api/v3

info:
  title: WASAText
  description: Web And Software Architecture Exam Project
  version: 1.0.0

security:
  - bearerAuth: []

tags:
  - name: users
    description: Users
  - name: messages
    description: Messages
  - name: conversations
    description: Conversations
  - name: groups
    description: Groups
  - name: reactions
    description: Reactions
  - name: comments
    description: Comments
  - name: session
    description: Session

paths:
  /groups:
    post:
      tags: ["groups"]
      summary: Create a group
      description: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: The group data
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
                photo:
                  $ref: "#/components/schemas/Photo"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["groups"]
      summary: Add user to group
      description: Add user to group
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The user to add
              type: object
              properties:
                userId:
                  description: User id
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                description: The user added to the group
                type: object
                properties:
                  userId:
                    description: User id
                    type: integer
                    format: int64
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: ["groups"]
      summary: Get group data
      description: Get group data
      operationId: getGroup
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Group"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: ["groups"]
      summary: Delete group
      description: Delete group
      operationId: deleteGroup
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/name:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["groups"]
      operationId: setGroupName
      summary: Change group name
      description: Change group name
      requestBody:
        required: true
        content:
          application/json:
            example:
              type: object
            schema:
              description: The group name
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: The group name
                type: object
                properties:
                  name:
                    $ref: "#/components/schemas/Name"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/photo:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: ["groups"]
      operationId: deleteGroupPhoto
      summary: Delete group photo
      description: Delete group photo
      responses:
        '204':
          description: No Content
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"
