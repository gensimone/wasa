        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["groups"]
      operationId: setGroupName
      summary: Change group name
      description: Change group name
      requestBody:
        required: true
        content:
          application/json:
            example:
              type: object
            schema:
              description: The group name
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Name"
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: The group name
                type: object
                properties:
                  name:
                    $ref: "#/components/schemas/Name"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/photo:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: ["groups"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: Update group photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: The group photo
              type: object
              properties:
                photo:
                  description: Photo
                  type: string
                  format: binary
                  minLength: 1
                  maxLength: 1014
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: The photo url
                type: object
                properties:
                  photoUrl:
                    description: URL
                    type: string
                    format: url
                    minLength: 1
                    maxLength: 1024
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/message:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["groups"]
      summary: Send a message to a group
      description: Send a message to a group
      operationId: sendMessageToGroup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MessageContent"
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/fmessage:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: ["groups"]
      summary: Forward a message to a group
      description: Forward a message to a group
      operationId: forwardMessageToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: The message to forward
              type: object
              properties:
                messageId:
                  description: Message id
                  type: integer
                  format: int64
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                type: object
              schema:
                $ref: "#/components/schemas/Message"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /groups/{groupId}/user:
    parameters:
      - name: groupId
        in: path
        description: Group id
        required: true
        schema:
          type: integer
          format: int64
