        schema:
          type: integer
          format: int64
    get:
      tags: ["conversations"]
      summary: Get members of a conversation
      description: Get members of a conversation
      operationId: getMembers
      responses:
        '200':
          description: Successful
          content:
            application/json:
              example:
                type: object
              schema:
                description: Users of conversation
                type: object
                properties:
                  userIds:
                    description: User ids
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
