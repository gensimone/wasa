            application/json:
              example:
                type: object
              schema:
                description: The user conversation ids
                type: object
                properties:
                  conversations:
                    description: Conversation ids
                    type: array
                    minItems: 1
                    maxItems: 1024
                    items:
                      type: object
                      properties:
                        conversationId:
                          description: Conversation id
                          type: integer
                          format: int64
                        isGroup:
                          description: Is it a group?
                          type: boolean
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '500':
          $ref: "#/components/responses/InternalServerError"

  /conversations/{conversationId}:
